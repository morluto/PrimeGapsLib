name = "PrimeGapsLib"
version = "0.1.0"
defaultTargets = ["PrimeGapsCert", "PrimeGapsTheory", "PrimeGaps"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/morluto/PrimeNumberTheoremAnd.git"
rev = "674f3b84fae034a51c49c89e2547c37a6edd0fb8"

# Keep this require last so that Mathlib's pins of transitive dependencies
# (batteries, aesop, Qq, ...) take precedence over those recorded in the
# PrimeNumberTheoremAnd manifest.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "PrimeGapsCert"
roots = ["PrimeGapsCert"]

[[lean_lib]]
name = "PrimeGapsTheory"
roots = ["PrimeGapsTheory"]

[[lean_lib]]
name = "PrimeGaps"
roots = ["PrimeGaps"]

## Comparator begins

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "ChallengeFast"

[[lean_lib]]
name = "SolutionFast"

## Comparator ends
